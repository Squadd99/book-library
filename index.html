<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Oxford Book Library</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://images.unsplash.com/photo-1512820790803-83ca734da794');
            background-size: cover;
            background-position: center;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #000;
        }

        p {
            font-size: 20px;
            max-width: 700px;
            text-shadow: 1px 1px 3px #000;
        }

        .enter-button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 18px;
            background-color: #5cb85c;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .enter-button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>

    <h1>Oxford Book Library</h1>
    <p>Welcome to the Oxford Book Library project! This library contains a variety of books classified by level. Click the button below to explore.</p>
    <button class="enter-button" onclick="window.location.href='library.html'">Enter Library</button>

</body>
</html>
